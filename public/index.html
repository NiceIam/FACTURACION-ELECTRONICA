<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DIAN Electronic Invoicing</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="#">
                <i class="fas fa-file-invoice-dollar me-2"></i>
                DIAN Electronic Invoicing
            </a>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row">
            <div class="col-md-3">
                <div class="list-group">
                    <a href="#" class="list-group-item list-group-item-action active" onclick="showSection('dashboard')">
                        <i class="fas fa-tachometer-alt me-2"></i>Dashboard
                    </a>
                    <a href="#" class="list-group-item list-group-item-action" onclick="showSection('companies')">
                        <i class="fas fa-building me-2"></i>Companies
                    </a>
                    <a href="#" class="list-group-item list-group-item-action" onclick="showSection('invoices')">
                        <i class="fas fa-file-invoice me-2"></i>Invoices
                    </a>
                </div>
            </div>

            <div class="col-md-9">
                <!-- Dashboard Section -->
                <div id="dashboard" class="content-section">
                    <h2><i class="fas fa-tachometer-alt me-2"></i>Dashboard</h2>
                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <div class="card dashboard-card bg-primary text-white">
                                <div class="card-body text-center">
                                    <i class="fas fa-file-invoice fa-2x mb-3"></i>
                                    <h4 id="totalInvoices">0</h4>
                                    <p class="mb-0">Total Invoices</p>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-4 mb-3">
                            <div class="card dashboard-card bg-success text-white">
                                <div class="card-body text-center">
                                    <i class="fas fa-building fa-2x mb-3"></i>
                                    <h4 id="totalCompanies">0</h4>
                                    <p class="mb-0">Companies</p>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-4 mb-3">
                            <div class="card dashboard-card bg-info text-white">
                                <div class="card-body text-center">
                                    <i class="fas fa-check-circle fa-2x mb-3"></i>
                                    <h4 id="approvedInvoices">0</h4>
                                    <p class="mb-0">DIAN Approved</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Companies Section -->
                <div id="companies" class="content-section" style="display: none;">
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <h2><i class="fas fa-building me-2"></i>Companies</h2>
                        <button class="btn btn-primary btn-action" onclick="showCreateCompanyModal()">
                            <i class="fas fa-plus me-2"></i>New Company
                        </button>
                    </div>
                    <div id="companiesList"></div>
                </div>

                <!-- Invoices Section -->
                <div id="invoices" class="content-section" style="display: none;">
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <h2><i class="fas fa-file-invoice me-2"></i>Invoices</h2>
                        <button class="btn btn-primary btn-action" onclick="showCreateInvoiceModal()">
                            <i class="fas fa-plus me-2"></i>New Invoice
                        </button>
                    </div>
                    <div id="invoicesList"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
